parent=base
import=common/keycloak

# The ?v= query busts browser caches: Keycloak's /resources/<hash>/ URL changes
# with the server version, not with theme content. Bump it on every theme release.
styles=css/material3.css?v=1.3.1

locales=en,ru

darkMode=true
kcDarkModeClass=m3-dark

kcHtmlClass=m3-html
kcBodyClass=m3-body

# ── Form structure (used by base templates: register, reset, OTP, etc.) ──
kcFormClass=m3-form
kcFormGroupClass=m3-group
kcFormGroupLabelClass=m3-group-label
kcLabelWrapperClass=m3-label-wrap
kcLabelClass=m3-label
kcInputWrapperClass=m3-input-wrap
kcInputClass=m3-input
kcInputGroup=m3-input-group
kcInputGroupItemClass=m3-input-group-item
kcFill=m3-fill
kcError=m3-error-mod
kcInputRequiredClass=m3-required
kcInputErrorMessageClass=m3-error
kcInputHelperTextBeforeClass=m3-helper
kcInputHelperTextAfterClass=m3-helper
kcFormHelperTextClass=m3-helper
kcInputHelperTextClass=m3-helper
kcInputHelperTextItemClass=m3-helper-item
kcInputHelperTextItemTextClass=m3-helper-item-text
kcContentWrapperClass=m3-content-wrap
kcFormSettingClass=m3-setting
kcFormOptionsClass=m3-options
kcFormOptionsWrapperClass=m3-options-wrap
kcFormButtonsClass=m3-buttons
kcFormActionGroupClass=m3-actions
kcMarginTopClass=m3-mt

# ── Password visibility toggle (passwordVisibility.js swaps the icon classes) ──
kcFormPasswordVisibilityButtonClass=m3-pass-toggle
kcFormPasswordVisibilityIconShow=m3-icon-eye
kcFormPasswordVisibilityIconHide=m3-icon-eye-off

# ── Buttons ──
kcButtonClass=m3-btn
kcButtonPrimaryClass=m3-btn-filled
kcButtonSecondaryClass=m3-btn-tonal
kcButtonDefaultClass=m3-btn-outlined
kcButtonLinkClass=m3-btn-text
kcButtonBlockClass=m3-btn-block
kcButtonLargeClass=m3-btn-lg

# ── Checkboxes / radios ──
kcCheckboxClass=m3-check
kcCheckboxInputClass=m3-check-input
kcCheckboxLabelClass=m3-check-label
kcCheckboxLabelRequiredClass=m3-required
kcInputClassCheckbox=m3-check
kcInputClassCheckboxInput=m3-check-input
kcInputClassCheckboxLabel=m3-check-label
kcInputClassRadio=m3-radio
kcInputClassRadioInput=m3-radio-input
kcInputClassRadioLabel=m3-check-label

# ── Alerts ──
kcAlertClass=m3-alert
kcAlertIconClass=m3-alert-icon
kcAlertTitleClass=m3-alert-title
kcAlertDescriptionClass=m3-alert-desc

# ── Social providers (markup is overridden in login.ftl, kept for other pages) ──
kcFormSocialAccountSectionClass=m3-social-section
kcFormSocialAccountListClass=m3-social-list
kcFormSocialAccountListButtonClass=m3-social-list-btn
kcFormSocialAccountNameClass=m3-social-name
kcCommonLogoIdP=m3-social-logo

# ── "Select authenticator" page ──
kcSelectAuthListClass=m3-authlist
kcSelectAuthListItemWrapperClass=m3-authlist-item-wrap
kcSelectAuthListItemClass=m3-authlist-item
kcSelectAuthListItemHeadingClass=m3-authlist-heading
kcSelectAuthListItemBodyClass=m3-authlist-body
kcSelectAuthListItemIconClass=m3-authlist-icon
kcSelectAuthListItemFillClass=m3-authlist-fill
kcSelectAuthListItemDescriptionClass=m3-authlist-desc

# ── OTP selector tiles ──
kcLoginOTPListClass=m3-otp-tile
kcLoginOTPListItemHeaderClass=m3-otp-header
kcLoginOTPListItemIconBodyClass=m3-otp-iconbody
kcLoginOTPListItemIconClass=m3-otp-icon
kcLoginOTPListItemTitleClass=m3-otp-title
kcLoginOTPListSelectedClass=m3-selected

# ── Misc ──
kcWebAuthnDefaultIcon=m3-webauthn-icon
kcResetFlowIcon=m3-icon-restart
kcFeedbackSuccessIcon=m3-fb-icon m3-fb-success
kcFeedbackWarningIcon=m3-fb-icon m3-fb-warning
kcFeedbackErrorIcon=m3-fb-icon m3-fb-error
kcFeedbackInfoIcon=m3-fb-icon m3-fb-info
kcLocaleClass=m3-locale
